name: update-profile-art

# Refreshes the contribution graph + stats card from the public calendar.
# The ASCII portrait is generated locally once (scripts/portrait_*.py).
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape contribution calendar
        run: python scripts/profile_data.py "${{ github.repository_owner }}"

      - name: Render graph and stats card
        run: |
          python scripts/heatmap_svg.py
          python scripts/stats_svg.py

      - name: Commit updated art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh contribution art"
            git push
          fi
